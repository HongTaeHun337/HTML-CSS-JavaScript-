<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        textarea, input {
            display: block;
            margin-bottom: 10px;
        }

        textarea {
            width: 500px;
            height: 300px;
            outline: none;
            resize: none;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <!-- ex13_mouse.html -->
    <h1>이벤트 <small>마우스</small></h1>
    
    <form name="form1">
        <textarea name="txt1"></textarea>
        <input type="button" value="버튼" name="btn1">
    </form>

    <script>
    
        /* 
        
            마우스 관련 이벤트
            -onmouseXXX

            1. onmouseover/onmouseenter
                - 해당 객체의 영역내에 마우스 커서가 진입하는 순간 발생

            2. onmouseout/onmouseleave
                - 해당 객체의 영역내에 마우스 커서가 빠져나가는 순간 발생

            3. onmousedown
                - 해당 객체의 영역내에서 마우스 버튼을 눌렀을 때 발생

            4. onmouseup
                - 해당 객체의 영역내에서 마우스 버튼을 뗏을 때 발생

            5. onmousemove
                - 해당 객체의 영역내에서 마우스 커서가 움직일때 발생

        */

        var txt1 = window.document.form1.txt1;
        var btn1 = window.document.form1.btn1;

        // txt1.onmouseover = m1;
        // txt1.onmouseout = m2;
        // txt1.onmousedown = m3;
        // txt1.onmouseup = m4;
        // txt1.onmousemove = m5;
        

        function m1() {
            // console.log('mouseover')
            window.document.body.bgColor = 'gold';
            message('mouseover')
        }
        function m2() {
            window.document.body.bgColor = 'white';
            message('mouseout')
        }
         function m3() {
            window.document.body.bgColor = 'tomato';
            message('mousedown')
        }
         function m4() {
            window.document.body.bgColor = 'blue';
            message('mouseup')
        }
        function m5() {
            // window.document.body.bgColor = 'blue';
            message('mousemove')
        }
        function message(txt) {
            txt1.value = new Date().toLocaleTimeString() + '>' + txt + '\n' + txt1.value;
        }
        

    </script>
</body>
</html>
